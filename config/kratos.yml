# 本地开发配置；生产配置另存文件，通过 -config 指定，敏感值使用 ${ENV_NAME}。
services:
  api: { name: tiktok.api, address: "0.0.0.0:8089", endpoint: "http://127.0.0.1:8089" }
  user: { name: tiktok.user, address: "0.0.0.0:8085", endpoint: "127.0.0.1:8085" }
  video: { name: tiktok.video, address: "0.0.0.0:8086", endpoint: "127.0.0.1:8086" }
  comment: { name: tiktok.comment, address: "0.0.0.0:8081", endpoint: "127.0.0.1:8081" }
  favorite: { name: tiktok.favorite, address: "0.0.0.0:8082", endpoint: "127.0.0.1:8082" }
  relation: { name: tiktok.relation, address: "0.0.0.0:8084", endpoint: "127.0.0.1:8084" }
  message: { name: tiktok.message, address: "0.0.0.0:8083", endpoint: "127.0.0.1:8083" }
registry:
  enabled: true
  endpoints: ["127.0.0.1:2379"]
database:
  dsn: "tiktokDB:tiktokDB@tcp(127.0.0.1:3309)/db_tiktok?charset=utf8mb4&parseTime=True&loc=UTC"
  # 使用实际配置的副本；本地单库配置为空，不会偷偷回退到主库。
  replicas: []
  max_open: 50
  max_idle: 10
redis: { address: "127.0.0.1:6379", password: tiktokRedis, db: 0 }
rabbitmq:
  url: "amqp://tiktokRMQ:tiktokRMQ@127.0.0.1:5672/tiktokRMQ"
  sync_interval: 10s
media:
  endpoint: "127.0.0.1:9000"
  access_key: tiktokMinio
  secret_key: tiktokMinio
  ssl: false
  buckets: { video: tiktok-videos, cover: tiktok-video-covers, avatar: tiktok-user-avatars, background: tiktok-user-backgrounds }
  expiry: 1h
  max_bytes: 50000000
jwt_key: local-development-only-change-this-32-byte-key
message_keys:
  public: "config/keys/message-public.pem"
  private: "config/keys/message-private.pem"
http: { tls_cert: "", tls_key: "", rate: 20, burst: 200 }
