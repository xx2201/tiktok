name: Go checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Real component acceptance
        shell: pwsh
        run: ./scripts/integration.ps1
